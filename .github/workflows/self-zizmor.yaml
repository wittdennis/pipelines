name: self-zizmor

on:
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" .github/workflows/
        env:
          ZIZMOR_VERSION: "1.30.1" # renovate: datasource=pypi depName=zizmor versioning=semver
          GH_TOKEN: ${{ github.token }}
